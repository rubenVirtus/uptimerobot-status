<!DOCTYPE html>
<html>
<head>
  <title>Panel de Estado - UptimeRobot (DEMO)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabletop.js/1.5.1/tabletop.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h2 { margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #f0f0f0; }
    .up { color: green; font-weight: bold; }
    .down { color: red; font-weight: bold; }
    a { color: #0077cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<h2>🟢 Estado de Servicios - DEMO UptimeRobot</h2>

<table id="estado">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>URL</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  window.onload = function() {
    Tabletop.init({
      key: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTls9FLgu_KM2M0V7Cthgxu8s0mTo-x-PJz5UBypuulPMOQp0huGDESimlvhXZvCp8Vjx410E1xnO5f/pubhtml',
      simpleSheet: true,
      callback: function(data) {
        const tbody = document.querySelector("#estado tbody");
        tbody.innerHTML = "";
        data.forEach(row => {
          if (row['Nombre'] && row['URL'] && row['Estado']) {
            const estado = row['Estado'].toUpperCase().includes('UP') ? 'up' : 'down';
            tbody.innerHTML += `
              <tr>
                <td>${row['Nombre']}</td>
                <td><a href="${row['URL']}" target="_blank">${row['URL']}</a></td>
                <td class="${estado}">${row['Estado']}</td>
              </tr>`;
          }
        });
      }
    });
  };
</script>

</body>
</html>
